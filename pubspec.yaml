name: car_spotter
description: "A new Flutter project for Car Spotting."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Database locale
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Gestione filesystem
  path_provider: ^2.1.6

  # GPS / geolocalizzazione
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  archive: ^4.0.9
  file_picker: ^13.1.0
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  isar_community_generator: ^3.3.2
  build_runner: ^2.10.5
  flutter_launcher_icons: ^0.14.4

# Unica sezione flutter alla fine del file:
flutter:
  uses-material-design: true
  assets:
    # Immagini visualizzate dall'app. Il logo del launcher è usato in fase di build.
    - assets/images/car_left.png
    - assets/images/car_right.png
    - assets/images/home_database.png
    - assets/images/home_your_spot.png
    - assets/images/photo_header1.jpg
    - assets/images/photo_header2.jpg
    - assets/images/photo_header3.jpg
    - assets/images/photo_header4.jpg
    - assets/images/photo_header5.jpg
    - assets/images/photo_header6.jpg
    - assets/images/photo_header7.jpg
    - assets/images/photo_header8.jpg
    - assets/images/photo_header9.jpg
    - assets/images/photo_header10.jpg
    - assets/images/journal_catalog1.jpg
    - assets/images/journal_catalog2.jpg
    - assets/images/journal_catalog3.jpg
    - assets/images/journal_catalog4.jpg
    - assets/images/journal_catalog5.jpg
    - assets/images/journal_catalog6.jpg
    - assets/images/journal_catalog7.jpg
    - assets/images/journal_catalog8.jpg
    - assets/images/vintage1.jpg
    - assets/images/vintage2.jpg
    - assets/images/vintage3.jpg
    - assets/images/vintage4.jpg
    - assets/images/vintage5.jpg
    - assets/images/vintage6.jpg
    - assets/data/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/carSpotterIcon.png"
  adaptive_icon_background: "#1E293B" # Un colore di sfondo nel caso in cui la foto non riempia i bordi arrotondati
